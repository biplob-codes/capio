services:
  - type: web
    name: ytdlp-backend
    env: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: ytdlp-frontend
          property: host
          # Render only gives the bare host via `host`; the app needs a
          # full origin. If this doesn't resolve to a usable value at
          # deploy time, set ALLOWED_ORIGINS manually in the dashboard
          # instead, e.g. https://ytdlp-frontend.onrender.com

  - type: web
    name: ytdlp-frontend
    env: docker
    dockerfilePath: ./client/Dockerfile
    dockerContext: ./client
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ytdlp-backend
          property: host
