services:
  backend:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ALLOWED_ORIGINS=http://localhost:5173

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "8080:80"
    environment:
      - PORT=80
    depends_on:
      - backend
