server {
    listen PORT_PLACEHOLDER;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html so client-side
    # routing (if you add React Router later) doesn't 404 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}