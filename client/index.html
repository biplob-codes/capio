<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Capio - Download YouTube Videos</title>
    <meta
      name="description"
      content="Paste a YouTube link, pick a resolution, download the video or just the audio."
    />

    <!-- Open Graph (Discord, Slack, Facebook link previews) -->
    <meta property="og:title" content="Capio" />
    <meta
      property="og:description"
      content="Paste a YouTube link, pick a resolution, download the video or just the audio."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Capio" />
    <meta
      name="twitter:description"
      content="Paste a YouTube link, pick a resolution, download the video or just the audio."
    />
    <meta name="twitter:image" content="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
